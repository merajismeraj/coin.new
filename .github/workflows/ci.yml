name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  custody-guard:
    # Spec §7.2: gates every PR. Fails on any code path that could hold keys,
    # sign for, or pool user funds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/custody-guard.mjs
      - run: node --test scripts/custody-guard.test.mjs

  checks:
    needs: custody-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
